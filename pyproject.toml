[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-advent"
version = "0.1.0"
description = "Interactive CLI chat using the OpenAI Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
ai-advent = "ai_advent.cli:main"

[tool.setuptools.packages.find]
include = ["ai_advent*"]
